[project]
name = "usp-mp"
dynamic = ["version"]
description = "Client for the Mein Postkorb automatic retrieval (Automatische Abholung) service of the Austrian Unternehmensserviceportal (USP)"
keywords = ["USP", "Unternehmensserviceportal", "Mein Postkorb", "Automatische Abholung", "e-Zustellung", "Austria", "SOAP"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications",
    "Topic :: Office/Business",
    "Typing :: Typed",
]
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Martin J. Laubach", email = "mjl@laubach.at" }
]
requires-python = ">=3.11"
dependencies = [
    "zeep>=4.2",
    # Floors are security fixes; the test suite passes back to requests 2.28 / urllib3 1.26.
    "requests>=2.32.4",  # CVE-2024-47081 (.netrc credentials leak); also CVE-2024-35195
    "urllib3>=2.8.0",    # imported directly (adapter.py); GHSA-8988-9cw3-xx77 (HTTPS proxy TLS config ignored), decompression-bomb fixes
    "cryptography>=41",
]

[project.scripts]
uspmp = "usp_mp.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-mock>=3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "demo: integration tests against the demo service (need USP_MP_P12 and USP_MP_P12_PASS)",
]

[build-system]
requires = ["setuptools>=77.0"]  # PEP 639 license expression
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"usp_mp" = [
    "certs/*",
    "wsdl/*",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.dynamic]
version = {attr = "usp_mp.__version__"}
