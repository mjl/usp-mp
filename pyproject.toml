[project]
name = "usp-mp"
dynamic = ["version"]
description = "Add your description here"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Martin J. Laubach", email = "mjl@laubach.at" }
]
requires-python = ">=3.11"
dependencies = [
    "zeep>=4.2",
    "requests>=2",
    "cryptography>=41",
]

[project.scripts]
uspmp = "usp_mp.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-mock>=3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "demo: integration tests against the demo service (need USP_MP_P12 and USP_MP_P12_PASS)",
]

[build-system]
requires = ["setuptools>=77.0"]  # PEP 639 license expression
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"usp_mp" = [
    "certs/*",
    "wsdl/*",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.dynamic]
version = {attr = "usp_mp.__version__"}
