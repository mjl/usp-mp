[project]
name = "usp-mp"
dynamic = ["version"]
description = "Client for the Mein Postkorb automatic retrieval (Automatische Abholung) service of the Austrian Unternehmensserviceportal (USP)"
keywords = ["USP", "Unternehmensserviceportal", "Mein Postkorb", "Automatische Abholung", "e-Zustellung", "Austria", "SOAP"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications",
    "Topic :: Office/Business",
    "Typing :: Typed",
]
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Martin J. Laubach", email = "mjl@laubach.at" }
]
requires-python = ">=3.11"
dependencies = [
    # Floors pick up security fixes; see docs/CHANGELOG.md. Older versions that still pass the
    # tests: requests 2.28, urllib3 1.26, cryptography 42.0.8, lxml 6.0 (5.x has no 3.14 wheels).
    "zeep>=4.3.3",            # GHSA-4cc2-g9w2-fhf6; zeep < 4.3 fails on Python 3.13+ (imports cgi)
    "requests>=2.32.4",       # CVE-2024-47081 (.netrc credentials leak); also CVE-2024-35195
    "urllib3>=2.8.0",         # imported directly (adapter.py); GHSA-8988-9cw3-xx77, decompression-bomb fixes
    "lxml>=6.1.1",            # imported directly (mail.py); CVE-2026-41066 (XXE by default), patched libxslt
    "cryptography>=48.0.1",   # GHSA-537c-gmf6-5ccf (vulnerable OpenSSL in wheels)
]

[project.urls]
Homepage = "https://github.com/mjl/usp-mp"
Documentation = "https://github.com/mjl/usp-mp/blob/master/docs/howto.md"
Changelog = "https://github.com/mjl/usp-mp/blob/master/docs/CHANGELOG.md"
Issues = "https://github.com/mjl/usp-mp/issues"

[project.scripts]
uspmp = "usp_mp.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "demo: integration tests against the demo service (need USP_MP_P12 and USP_MP_P12_PASS)",
]

[build-system]
requires = ["setuptools>=77.0"]  # PEP 639 license expression
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"usp_mp" = [
    "certs/*",
    "wsdl/*",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "usp_mp.__version__"}
